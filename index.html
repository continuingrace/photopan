<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e7ddc1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>PhotoPan</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><header><b>PhotoPan</b><span id="version">v0.1.0</span><button id="saveStyle">스타일 저장</button></header>
<main><section class="sticky"><div id="board" class="board"><div id="photos"></div><footer id="boardFooter"><div id="titleOut">BROOKLYN JAM</div><div id="copyOut">© PhotoPan. all rights reserved.</div></footer></div></section>
<section class="controls">
<label class="upload">사진 추가<input id="picker" type="file" accept="image/*" multiple></label><div class="row"><button id="shuffle">자동 배치</button><button id="clear">전체 삭제</button></div>
<details open><summary>보드</summary><label>색상 <input id="bg" type="color" value="#e7ddc1"></label><label>재질 <select id="texture"><option value="paper">종이</option><option value="clean">매끈</option><option value="grain">그레인</option></select></label></details>
<details open><summary>하단 텍스트</summary><label>제목 <input id="title" value="BROOKLYN JAM"></label><label>카피라이트 <input id="copy" value="© PhotoPan. all rights reserved."></label><label>서체 <select id="font"><option>Georgia</option><option>Arial</option><option>Helvetica</option><option>Times New Roman</option><option>Courier New</option><option>Trebuchet MS</option></select></label><label>정렬 <select id="align"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right" selected>오른쪽</option></select></label><label>글자 크기 <input id="fontSize" type="range" min="10" max="32" value="18"></label><label>자간 <input id="letter" type="range" min="-2" max="10" step=".5" value="0"></label><label>행간 <input id="line" type="range" min="1" max="2" step=".05" value="1.25"></label><label>색상 <input id="textColor" type="color" value="#2d211c"></label><label>투명도 <input id="textOpacity" type="range" min=".2" max="1" step=".05" value="1"></label></details>
<details open><summary>선택한 사진</summary><p id="hint">사진을 탭해 선택하세요.</p><label>기울기 <input id="rotate" type="range" min="-15" max="15" step="1" value="0"></label><label>크기 <input id="scale" type="range" min="60" max="160" value="100"></label><label>모션 <select id="motion"><option value="none">없음</option><option value="tremble">잔잔한 트렘블</option><option value="float">부드러운 플로트</option><option value="breathe">숨쉬기</option><option value="sway">느린 스웨이</option></select></label><button id="remove">선택 사진 삭제</button></details>
<p class="note">편집 내용과 업로드 사진은 이 기기의 브라우저 저장소에 자동 보존됩니다.</p></section></main><script src="app.js"></script></body></html>
